name: Consume Distributed Validation Layer
on:
  push:
    branches: [master, develop]
  pull_request:


permissions:
  contents: read
  security-events: write
  
jobs:
  validation:
    uses: YaphetS0206/matrix-workflow/.github/workflows/distributed-validation.yml@demo-2
    with:
      python-versions: '[3.10, 3.11, 3.12]'
      min-coverage: 80
      max-high-vulns: 0
      run-semgrep: true
      run-bandit: true
      run-trivy: true